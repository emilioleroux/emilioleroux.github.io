<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Paddle Checkout — Frame & Shape Kit</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 650px; margin: 10vh auto; padding: 20px; }
    .note { color: #555; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Secure checkout</h1>
  <p id="status" class="note">Opening Paddle checkout…</p>
  <script>
    // Replace with a PUBLIC Paddle Sandbox client-side token, not an API key.
    const PADDLE_CLIENT_TOKEN = "test_398be86c1728ae6e232a4af3a78";
    const status = document.getElementById("status");
    const transactionId = new URLSearchParams(location.search).get("_ptxn");

    if (!/^txn_[a-zA-Z0-9]+$/.test(transactionId || "")) {
      status.textContent = "This payment link is invalid. Return to Canva and choose Upgrade again.";
    } else if (PADDLE_CLIENT_TOKEN === "REPLACE_WITH_SANDBOX_CLIENT_TOKEN") {
      status.textContent = "Paddle checkout is not yet configured.";
    } else {
      try {
        Paddle.Environment.set("sandbox");
        Paddle.Initialize({
          token: PADDLE_CLIENT_TOKEN,
          checkout: {
            settings: {
              displayMode: "overlay",
              theme: "light",
              successUrl: "https://emilioleroux.github.io/frame-shape-kit/success/?provider=paddle"
            }
          }
        });
        Paddle.Checkout.open({ transactionId });
      } catch (error) {
        console.error("Unable to initialize Paddle checkout", error);
        status.textContent = "Unable to open checkout. Please return to Canva and try again.";
      }
    }
  </script>
</body>
</html>
